<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0a">
  <title>Company Zero</title>
  <meta name="description" content="Tell Company Zero what you need done. It gets to work and brings back results.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="system.css">
</head>
<body>
  <div class="boot-screen" id="bootScreen" aria-label="Starting Company Zero">
    <div class="boot-lockup"><img class="boot-mark" src="assets/brand/company-zero-mark-small.png" alt=""><div><strong>Company Zero</strong><span id="bootStatus">Getting things ready</span></div></div>
    <div class="boot-line"><i></i></div>
  </div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <button class="brand" data-page="home" aria-label="Company Zero home"><img class="brand-mark" src="assets/brand/company-zero-mark-small.png" alt=""><span>Company Zero</span></button>
        <button class="side-close" id="sideClose" aria-label="Close menu"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <button class="new-work" id="newWork"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 12H12M12 12H18M12 12V18M12 12V6"/></svg></span><span>New work</span></button>
      <nav class="primary-nav" id="nav"></nav>
      <div class="recent-wrap">
        <div class="recent-head"><span>Recent</span><button id="showAllWork">View all</button></div>
        <div class="recent-list" id="recentList"></div>
      </div>
      <div class="side-bottom">
        <button class="side-link" data-page="settings"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg></span><span>Settings</span></button>
        <button class="runtime-state" data-page="advanced"><span class="runtime-dot" id="runtimeDot"></span><span><strong id="runtimeTitle">Connecting</strong><small id="runtimeSub">Runtime</small></span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="top-title" id="topTitle">Home</div>
        <div class="top-actions"><button class="quiet-btn" id="refresh">Refresh</button><button class="avatar-btn" aria-label="Account">D</button></div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalWrap" hidden><form class="modal" id="modal"></form></div>
  <div class="busy" id="busy" hidden></div>
  <div class="toast" id="toast"></div>
  <script type="module" src="system.js"></script>
</body>
</html>
