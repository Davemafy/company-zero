<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b09">
  <title>Company Zero — A general operating interface</title>
  <meta name="description" content="State an outcome. Company Zero builds and operates the organization required to pursue it.">
  <link rel="stylesheet" href="system.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row"><button class="brand" data-page="outcome"><span class="zero">0</span><span>Company Zero</span></button><button class="nav-close" id="navClose">×</button></div>
      <button class="company-switch" id="companySwitch"><span class="company-avatar" id="companyAvatar">0</span><span><small>CURRENT OUTCOME</small><strong id="companyName">No outcome yet</strong></span><span class="chev">⌄</span></button>
      <nav id="nav"></nav>
      <div class="sidebar-bottom"><div class="runtime-row"><span class="runtime-dot" id="runtimeDot"></span><span><strong id="runtimeTitle">Checking runtime</strong><small id="runtimeSub">Control plane</small></span></div><div class="sidebar-meta"><span>Company Zero</span><span>v6 universal</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="hamburger" id="hamburger">☰</button><div class="breadcrumb"><span>Company Zero</span><b>/</b><strong id="crumb">Outcome</strong></div><div class="top-actions"><button class="ghost-btn" id="refresh">Refresh</button><button class="primary-btn" id="newCompany">＋ New outcome</button></div></header>
      <section id="view"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalWrap" hidden><form class="modal" id="modal"></form></div>
  <div class="busy" id="busy" hidden><span></span></div>
  <div class="toast" id="toast"></div>
  <script type="module" src="system.js"></script>
</body>
</html>
