<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Company Zero</title>
  <meta name="description" content="Build, operate, measure and improve outcome-defined companies.">
  <link rel="stylesheet" href="system.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <aside id="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#overview" aria-label="Company Zero overview"><span aria-hidden="true">0</span><strong>Company Zero</strong></a>
      <nav id="nav"></nav>
      <div class="side-utility"><button class="nav-item" data-page="controls">Settings</button><div class="runtime"><i aria-hidden="true"></i><div><b id="runtime">Checking system</b><small id="storage">—</small></div></div></div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button id="mobile" class="icon-button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
        <button id="companyPicker" class="company-picker">No company selected</button>
        <div class="top-actions"><span id="topStatus" class="status status-muted">Not configured</span><button class="button primary" id="create">Create company</button></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
  <dialog id="modal" aria-labelledby="modalTitle"><form method="dialog" id="form"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="system.js"></script>
</body>
</html>
