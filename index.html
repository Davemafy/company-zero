<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0b0a">
  <title>Company Zero — Tell us what you need done</title>
  <meta name="description" content="Tell Company Zero what you need done. It builds the AI company to deliver it.">
  <link rel="stylesheet" href="system.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row"><button class="brand" data-page="home"><span class="zero">0</span><span>Company Zero</span></button><button class="nav-close" id="navClose">×</button></div>
    <button class="company-switch" id="companySwitch"><span class="company-avatar" id="companyAvatar">0</span><span><small>ACTIVE COMPANY</small><strong id="companyName">No company yet</strong></span><span class="chev">⌄</span></button>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="runtime-row"><span class="runtime-dot" id="runtimeDot"></span><span><strong id="runtimeTitle">Checking runtime</strong><small id="runtimeSub">Inference not verified</small></span></div>
      <div class="sidebar-meta"><span class="engine">Deep engine. Quiet interface.</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="breadcrumb"><span>Company Zero</span><b>/</b><strong id="crumb">Overview</strong></div>
      <div class="top-actions"><button class="secondary-btn" id="refresh">Refresh</button><button class="primary-btn" id="newCompany">＋ Build a company</button></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div class="modal-backdrop" id="modalWrap" hidden><form class="modal" id="modal"></form></div>
<div class="busy" id="busy" hidden><span></span></div>
<div class="toast" id="toast"></div>
<script type="module" src="system.js"></script>
</body>
</html>
