name: verify + production torture

on:
  push:
    branches:
      - verify-91e-fallback
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-torture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted fallback verification
        run: |
          node tests/outcome-control-e2e.test.mjs
          node tests/outcome-control-e2e.test.mjs
          node tests/outcome-control-e2e.test.mjs
          node tests/provider-policy-reliability.test.mjs
          node tests/v1-torture-test.mjs
          node tests/instant-value.test.mjs
