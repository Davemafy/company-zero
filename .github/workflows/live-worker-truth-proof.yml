name: live worker truth proof

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prove:
    if: contains(github.event.head_commit.message, '[live-worker-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact Railway worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const context='empathetic-exploration - company-zero';
          const deadline=Date.now()+8*60_000;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          while(Date.now()<deadline){
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/status`,{headers:{accept:'application/vnd.github+json',authorization:`Bearer ${process.env.GH_TOKEN}`,'x-github-api-version':'2022-11-28'}});
            if(!response.ok)throw Error('status_http_'+response.status);
            const body=await response.json();
            const status=(body.statuses||[]).find(x=>x.context===context);
            console.log('railway-status='+JSON.stringify(status?{state:status.state,target_url:status.target_url}:null));
            if(['failure','error'].includes(status?.state))throw Error('railway_deployment_'+status.state);
            if(status?.state==='success')process.exit(0);
            await sleep(5000);
          }
          throw Error('railway_deployment_timeout');
          NODE
      - name: Fresh car-company truth proof
        env:
          COMPANY_ZERO_BASE_URL: https://companyzero-hq.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.COMPANY_ZERO_BASE_URL.replace(/\/$/,'');
          let cookie='';
          const api=async(path,{method='GET',body}={})=>{
            const headers={'content-type':'application/json'};if(cookie)headers.cookie=cookie;
            const response=await fetch(base+'/api/v1'+path,{method,headers,body:body==null?undefined:JSON.stringify(body)});
            const setCookie=response.headers.get('set-cookie');if(setCookie&&!cookie)cookie=setCookie.split(';')[0];
            const text=await response.text();let value;try{value=text?JSON.parse(text):{}}catch{value={raw:text}};
            if(!response.ok)throw Object.assign(Error(value?.error||('http_'+response.status)),{status:response.status,details:value});
            return value;
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const start=await api('/interactions',{method:'POST',body:{message:'make a car company'}});
          assert.equal(start.kind,'work');
          const companyId=start.operating?.company?.id,sessionId=start.operating?.session?.id;
          assert.ok(companyId&&sessionId);
          console.log('CAR_PROOF_STARTED='+JSON.stringify({companyId,sessionId}));
          let hydrated=null,latest=null,records=[];
          const deadline=Date.now()+12*60_000;
          while(Date.now()<deadline){
            hydrated=await api('/companies/'+companyId+'/sessions/'+sessionId);
            records=hydrated.company?.records||[];
            const artifacts=(hydrated.artifacts||records.filter(x=>x.kind==='artifact'&&x.data?.sessionId===sessionId))
              .filter(x=>['ready','partial'].includes(x.state))
              .sort((a,b)=>Number(b.data?.deliverableVersion||1)-Number(a.data?.deliverableVersion||1)||String(b.created_at).localeCompare(String(a.created_at)));
            latest=artifacts[0]||null;
            if(latest&&['READY','PARTIAL'].includes(latest.data?.readiness||''))break;
            await sleep(2000);
          }
          assert.ok(latest,'mission must terminate with a persisted candidate');
          const files=Array.isArray(latest.data?.files)?latest.data.files:[];
          assert.ok(files.some(f=>String(f?.content||'').trim().length>=160),'candidate must preserve substantive work');
          const scoped=records.filter(x=>!x.data?.sessionId||x.data.sessionId===sessionId);
          const evidence=scoped.filter(x=>x.kind==='world_fact'&&x.data?.classification==='EXTERNAL_OBSERVATION');
          const badEvidence=evidence.filter(x=>/burger|whopper|kfc|chicken nuggets?/i.test(`${x.data?.subject||''} ${x.data?.value?.title||''} ${x.data?.value?.snippet||''}`));
          assert.equal(badEvidence.length,0,'automotive mission must not persist obvious fast-food search noise');
          const events=scoped.filter(x=>x.kind==='runtime_event');
          const roleSummary=events.filter(x=>x.data?.type==='ROLE_TELEMETRY_SUMMARY').at(-1)?.data?.data||latest.data?.runtimeTelemetry?.roleSummary||null;
          const verifierStarted=events.some(x=>x.data?.type==='CLAIM_VERIFIER_STARTED');
          const rejectedEvents=events.filter(x=>x.data?.type==='CLAIM_VERIFIER_REJECTED');
          assert.ok(!rejectedEvents.some(x=>(x.data?.data?.rejected||[]).length===0&&/rejected 0 unsupported/i.test(String(x.data?.message||''))),'UI/runtime must not claim verifier rejected zero claims');
          if(roleSummary&&Number(roleSummary.completedRoles)<Number(roleSummary.expectedRoles)){
            assert.equal(latest.data?.readiness,'PARTIAL','incomplete organization cannot become READY');
            assert.equal(verifierStarted,false,'structurally incomplete organization must stop before claim verification');
          }
          if(latest.data?.readiness==='READY'){
            assert.equal(latest.state,'ready');
            assert.equal(latest.data?.claimVerification?.passed,true);
            assert.equal(latest.data?.qa?.passed,true);
            assert.notEqual(latest.data?.degraded,true);
          }else{
            assert.equal(latest.state,'partial');
            assert.notEqual(latest.data?.qa?.passed,true);
          }
          const summary={
            companyId,sessionId,readiness:latest.data?.readiness,state:latest.state,
            files:files.map(f=>f.name),evidence:evidence.map(x=>x.data?.subject),
            roleSummary,claimVerification:latest.data?.claimVerification||null,
            providers:latest.data?.runtimeTelemetry?.providers||[],
            models:latest.data?.runtimeTelemetry?.models||[],
            eventTypes:events.map(x=>x.data?.type),
            roleEvents:events.filter(x=>/^ROLE_/.test(String(x.data?.type||''))).map(x=>({type:x.data.type,message:x.data.message,data:x.data.data}))
          };
          console.log('CAR_PROOF_RESULT='+JSON.stringify(summary));
          NODE
