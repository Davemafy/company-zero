name: live localized opportunity proof

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prove:
    if: contains(github.event.head_commit.message, '[live-opportunity-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact Railway worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const context='empathetic-exploration - company-zero',deadline=Date.now()+8*60_000,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          while(Date.now()<deadline){
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/status`,{headers:{accept:'application/vnd.github+json',authorization:`Bearer ${process.env.GH_TOKEN}`,'x-github-api-version':'2022-11-28'}});
            if(!response.ok)throw Error('status_http_'+response.status);
            const body=await response.json(),status=(body.statuses||[]).find(x=>x.context===context);
            console.log('railway-status='+JSON.stringify(status?{state:status.state,target_url:status.target_url}:null));
            if(['failure','error'].includes(status?.state))throw Error('railway_deployment_'+status.state);
            if(status?.state==='success')process.exit(0);
            await sleep(5000);
          }
          throw Error('railway_deployment_timeout');
          NODE
      - name: Nigeria opportunity research proof
        env:
          COMPANY_ZERO_BASE_URL: https://companyzero-hq.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.COMPANY_ZERO_BASE_URL.replace(/\/$/,'');let cookie='';
          const api=async(path,{method='GET',body}={})=>{
            const headers={'content-type':'application/json'};if(cookie)headers.cookie=cookie;
            const response=await fetch(base+'/api/v1'+path,{method,headers,body:body==null?undefined:JSON.stringify(body)});
            const setCookie=response.headers.get('set-cookie');if(setCookie&&!cookie)cookie=setCookie.split(';')[0];
            const text=await response.text();let value;try{value=text?JSON.parse(text):{}}catch{value={raw:text}};
            if(!response.ok)throw Object.assign(Error(value?.error||('http_'+response.status)),{status:response.status,details:value});
            return value;
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const start=await api('/interactions',{method:'POST',body:{message:'enterprenuer ship ideas in nigerai'}});
          assert.equal(start.kind,'work');
          const companyId=start.operating?.company?.id,sessionId=start.operating?.session?.id;assert.ok(companyId&&sessionId);
          console.log('OPPORTUNITY_PROOF_STARTED='+JSON.stringify({companyId,sessionId}));
          let latest=null,records=[];const deadline=Date.now()+10*60_000;
          while(Date.now()<deadline){
            const hydrated=await api('/companies/'+companyId+'/sessions/'+sessionId);
            records=hydrated.company?.records||[];
            const artifacts=(hydrated.artifacts||records.filter(x=>x.kind==='artifact'&&x.data?.sessionId===sessionId))
              .filter(x=>['ready','partial'].includes(x.state))
              .sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
            latest=artifacts[0]||null;
            const terminal=records.some(x=>x.kind==='runtime_event'&&x.data?.sessionId===sessionId&&['RESULT_READY','RESULT_PARTIAL'].includes(x.data?.type));
            if(latest&&terminal)break;
            await sleep(1500);
          }
          assert.ok(latest,'localized opportunity mission must persist a terminal artifact');
          const scoped=records.filter(x=>!x.data?.sessionId||x.data.sessionId===sessionId),events=scoped.filter(x=>x.kind==='runtime_event');
          const plan=events.filter(x=>x.data?.type==='PLAN_COMPILED').at(-1);
          assert.equal(plan?.data?.data?.kind,'research','localized entrepreneurship ideas must compile as research');
          assert.equal(plan?.data?.data?.requiresFreshEvidence,true);
          assert.ok(events.some(x=>x.data?.type==='RESEARCH_STARTED'),'localized recommendations must attempt live research');
          const badLegacy=events.filter(x=>x.data?.type==='CLAIM_VERIFIER_RETRYING').some(x=>/gpt-oss-20b/.test(String(x.data?.message||'')));
          assert.equal(badLegacy,false,'verifier must not fall back to Groq 20B');
          const failed400=events.filter(x=>x.data?.type==='CLAIM_VERIFIER_FAILED').some(x=>/groq_http_400/.test(String(x.data?.message||'')));
          assert.equal(failed400,false,'Groq 400 must not be the terminal verifier failure after compatibility/provider fallback');
          const evidence=scoped.filter(x=>x.kind==='world_fact'&&x.data?.classification==='EXTERNAL_OBSERVATION');
          console.log('OPPORTUNITY_PROOF_RESULT='+JSON.stringify({
            companyId,sessionId,readiness:latest.data?.readiness,state:latest.state,
            title:latest.data?.title,
            evidenceCount:evidence.length,
            evidence:evidence.map(x=>({subject:x.data?.subject,url:x.data?.externalRef})),
            claimVerification:{passed:latest.data?.claimVerification?.passed,failed:latest.data?.claimVerification?.failed,provider:latest.data?.claimVerification?.provider,model:latest.data?.claimVerification?.model,rejected:(latest.data?.claimVerification?.rejected||[]).length},
            verifierRetries:events.filter(x=>x.data?.type==='CLAIM_VERIFIER_RETRYING').map(x=>x.data?.message),
            researchEvents:events.filter(x=>/^RESEARCH_/.test(String(x.data?.type||''))).map(x=>({type:x.data.type,message:x.data.message,data:x.data.data}))
          }));
          NODE
