name: live food-brand proof

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prove:
    if: contains(github.event.head_commit.message, '[live-food-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact Railway worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const context='empathetic-exploration - company-zero',deadline=Date.now()+8*60_000,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          while(Date.now()<deadline){
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/status`,{headers:{accept:'application/vnd.github+json',authorization:`Bearer ${process.env.GH_TOKEN}`,'x-github-api-version':'2022-11-28'}});
            if(!response.ok)throw Error('status_http_'+response.status);
            const body=await response.json(),status=(body.statuses||[]).find(x=>x.context===context);
            console.log('railway-status='+JSON.stringify(status?{state:status.state,target_url:status.target_url}:null));
            if(['failure','error'].includes(status?.state))throw Error('railway_deployment_'+status.state);
            if(status?.state==='success')process.exit(0);
            await sleep(5000);
          }
          throw Error('railway_deployment_timeout');
          NODE
      - name: Fresh food-brand proof
        env:
          COMPANY_ZERO_BASE_URL: https://companyzero-hq.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.COMPANY_ZERO_BASE_URL.replace(/\/$/,'');let cookie='';
          const api=async(path,{method='GET',body}={})=>{
            const headers={'content-type':'application/json'};if(cookie)headers.cookie=cookie;
            const response=await fetch(base+'/api/v1'+path,{method,headers,body:body==null?undefined:JSON.stringify(body)});
            const setCookie=response.headers.get('set-cookie');if(setCookie&&!cookie)cookie=setCookie.split(';')[0];
            const text=await response.text();let value;try{value=text?JSON.parse(text):{}}catch{value={raw:text}};
            if(!response.ok)throw Object.assign(Error(value?.error||('http_'+response.status)),{status:response.status,details:value});
            return value;
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const startedAt=Date.now(),start=await api('/interactions',{method:'POST',body:{message:'make a food brand'}});
          assert.equal(start.kind,'work');const companyId=start.operating?.company?.id,sessionId=start.operating?.session?.id;assert.ok(companyId&&sessionId);
          console.log('FOOD_PROOF_STARTED='+JSON.stringify({companyId,sessionId}));
          let latest=null,records=[];const deadline=Date.now()+12*60_000;
          while(Date.now()<deadline){
            const hydrated=await api('/companies/'+companyId+'/sessions/'+sessionId);
            records=hydrated.company?.records||[];
            const artifacts=(hydrated.artifacts||records.filter(x=>x.kind==='artifact'&&x.data?.sessionId===sessionId)).filter(x=>['ready','partial'].includes(x.state)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
            latest=artifacts[0]||null;
            const terminal=records.some(x=>x.kind==='runtime_event'&&x.data?.sessionId===sessionId&&['RESULT_READY','RESULT_PARTIAL'].includes(x.data?.type));
            if(latest&&terminal)break;
            await sleep(2000);
          }
          assert.ok(latest,'food-brand mission must persist a terminal artifact');
          const scoped=records.filter(x=>!x.data?.sessionId||x.data.sessionId===sessionId),events=scoped.filter(x=>x.kind==='runtime_event');
          const evidence=scoped.filter(x=>x.kind==='world_fact'&&x.data?.classification==='EXTERNAL_OBSERVATION');
          const evidenceText=evidence.map(x=>`${x.data?.subject||''} ${x.data?.externalRef||''} ${x.data?.value?.title||''} ${x.data?.value?.snippet||''}`).join('\n');
          assert.doesNotMatch(evidenceText,/holyoke|tripadvisor|restaurantji|yelp\.com|best restaurants|foodnetwork\.com|daruma bbq|schermerhorn/i,'food-brand evidence must not collapse into local restaurant directories');
          const planner=events.find(x=>x.data?.type==='PLANNER_STARTED');
          assert.ok(planner,'planner start event missing');
          assert.match(String(planner.data?.message||planner.data?.data?.model||''),/gemini-3\.5-flash-lite/i,'Gemini must be the primary planner');
          const roleStarted=events.filter(x=>x.data?.type==='ROLE_STARTED');
          assert.ok(roleStarted.length>=4,'expected organization roles to start');
          assert.ok(roleStarted.every(x=>x.data?.data?.provider==='gemini'),'every role must start on Gemini, not TensorMux/OpenRouter');
          const summary=events.filter(x=>x.data?.type==='ROLE_TELEMETRY_SUMMARY').at(-1)?.data?.data||latest.data?.runtimeTelemetry?.roleSummary||null;
          assert.equal(Number(summary?.completedRoles),Number(summary?.expectedRoles),'all organization roles must complete');
          const verifierFailures=events.filter(x=>x.data?.type==='CLAIM_VERIFIER_FAILED');
          assert.equal(verifierFailures.length,0,'Groq verifier infrastructure must not terminate with HTTP/schema failure');
          const files=Array.isArray(latest.data?.files)?latest.data.files:[];assert.ok(files.length>=3&&files.every(f=>String(f?.content||'').trim().length>=160));
          if(latest.data?.readiness==='READY'){assert.equal(latest.state,'ready');assert.equal(latest.data?.claimVerification?.passed,true)}
          else{assert.equal(latest.state,'partial');assert.equal(latest.data?.claimVerification?.failed,false,'PARTIAL may be claim rejection, not verifier infrastructure failure');assert.ok((latest.data?.claimVerification?.rejected||[]).length>0,'truthful PARTIAL must identify rejected claims')}
          console.log('FOOD_PROOF_RESULT='+JSON.stringify({companyId,sessionId,readiness:latest.data?.readiness,state:latest.state,durationMs:Date.now()-startedAt,files:files.map(f=>f.name),evidence:evidence.map(x=>x.data?.subject),roleSummary:summary,claimVerification:{passed:latest.data?.claimVerification?.passed,failed:latest.data?.claimVerification?.failed,model:latest.data?.claimVerification?.model,provider:latest.data?.claimVerification?.provider,rejected:(latest.data?.claimVerification?.rejected||[]).length},providers:latest.data?.runtimeTelemetry?.providers||[],models:latest.data?.runtimeTelemetry?.models||[],retryEvents:events.filter(x=>x.data?.type==='CLAIM_VERIFIER_RETRYING').map(x=>x.data?.message)}));
          NODE
